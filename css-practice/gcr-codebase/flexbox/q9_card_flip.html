<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Flip</title>
  <link rel="stylesheet" href="q9_card_flip.css">
</head>
<body>
  <main class="scene">
    <div class="card">
      <div class="side front">
        <h2>Web Development</h2>
        <img src="https://placehold.co/500x300?text=Web+Development" alt="Web Development">
      </div>
      <div class="side back">
        <h2>About</h2>
        <p>Web development combines HTML, CSS and programming to create interactive websites and applications.</p>
      </div>
    </div>
  </main>
</body>
</html>
