<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini User Interface</title>
  <link rel="stylesheet" href="q10.css">
</head>
<body>
  <header><h1>My Mini UI</h1></header>
  <main>
    <section class="main-card">
      <div class="visual">
        <img src="https://picsum.photos/id/1005/400/260" alt="Sample landscape">
        <h2>Welcome!</h2>
        <p>Complete the form below to continue.</p>
      </div>
      <form>
        <label for="name">Name</label>
        <input id="name" type="text" placeholder="Enter your name" required>
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="Enter your email" required>
        <div class="form-buttons">
          <button type="submit">Submit</button>
          <button type="reset">Reset</button>
        </div>
      </form>
    </section>
  </main>
  <footer><p>&copy; 2026 Mini UI</p></footer>
</body>
</html>
