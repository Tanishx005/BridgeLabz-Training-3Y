<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Styled Button Collection</title>
  <link rel="stylesheet" href="q5.css">
</head>
<body>
  <main>
    <h1>Styled Button Collection</h1>
    <section class="buttons">
      <button class="btn primary">Primary</button>
      <button class="btn secondary">Secondary</button>
      <button class="btn outline">Outline</button>
      <button class="btn disabled" disabled>Disabled</button>
    </section>
    <p class="note">Try focusing the buttons with the keyboard and hovering over them.</p>
  </main>
</body>
</html>
