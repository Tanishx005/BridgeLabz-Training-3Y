<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10 Complete Layout</title>
    <link rel="stylesheet" href="10_complete_layout.css">
</head>
<body>
    <header class="header"><nav><a href="#home">Home</a><a href="#about">About</a><a href="#services">Services</a><a href="#contact">Contact</a></nav></header>
    <main>
        <section id="home" class="hero"><div class="hero-content"><h1>Welcome to My Website</h1><p>Building practical digital experiences.</p></div></section>
        <section id="about" class="about">
            <div><h2>About</h2><p>I work on software solutions with an interest in cloud, DevOps, and AI.</p></div>
            <img src="https://picsum.photos/seed/about/600/450" alt="About section image">
        </section>
        <section id="services" class="services">
            <h2>Services</h2>
            <div class="service-grid"><article>Web Development</article><article>Cloud Solutions</article><article>AI Solutions</article></div>
        </section>
        <section id="contact" class="contact">
            <h2>Contact</h2>
            <form action="#" method="post"><input type="text" placeholder="Name" required><input type="email" placeholder="Email" required><textarea placeholder="Message" required></textarea><button type="submit">Send</button></form>
        </section>
    </main>
    <footer>&copy; 2026 My Website</footer>
</body>
</html>
