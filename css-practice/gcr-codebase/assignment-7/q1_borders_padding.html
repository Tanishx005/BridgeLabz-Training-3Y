<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Borders and Padding</title>
  <link rel="stylesheet" href="q1_borders_padding.css">
</head>
<body>
  <header><h1>Borders &amp; Padding</h1></header>
  <main class="boxes">
    <section class="box solid"><h2>Solid Border</h2><p>Padding: 10px</p></section>
    <section class="box dashed"><h2>Dashed Border</h2><p>Padding: 20px</p></section>
    <section class="box double"><h2>Double Border</h2><p>Padding: 30px</p></section>
    <section class="box groove"><h2>Groove Border</h2><p>Rounded corners</p></section>
  </main>
  <footer>&copy; 2026 CSS Demonstration</footer>
</body>
</html>
