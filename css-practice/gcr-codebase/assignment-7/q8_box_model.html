<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Box Model Exploration</title>
  <link rel="stylesheet" href="q8_box_model.css">
</head>
<body>
  <h1>CSS Box Model</h1>
  <main class="demo">
    <div class="margin-layer">
      <div class="border-layer">
        <div class="padding-layer">
          <div class="content-layer">
            <h2>Content</h2>
            <p>Content is the innermost layer.</p>
          </div>
        </div>
      </div>
    </div>
  </main>
  <section class="notes">
    <p><strong>Content:</strong> The actual text or element.</p>
    <p><strong>Padding:</strong> Space between content and border.</p>
    <p><strong>Border:</strong> Edge surrounding padding and content.</p>
    <p><strong>Margin:</strong> Space outside the border.</p>
  </section>
</body>
</html>
