<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced CSS Selectors</title>
  <link rel="stylesheet" href="q5_advanced_selectors.css">
</head>
<body>
  <main class="content">
    <h1>Advanced CSS Selectors</h1>
    <ul class="items">
      <li><input type="text" placeholder="Text input"></li>
      <li><input type="email" placeholder="Email input"></li>
      <li><a href="https://example.com">Secure HTTPS link</a></li>
      <li><a href="https://developer.mozilla.org">MDN HTTPS link</a></li>
      <li><button>Hover Me</button></li>
    </ul>
    <section class="parent">
      <p>First paragraph</p>
      <p>Second paragraph</p>
      <div><p>Descendant paragraph</p></div>
    </section>
  </main>
</body>
</html>
