<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal Portfolio</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="style.css">
</head>
<body class="bg-light text-dark">
<header class="bg-dark text-white text-center p-5">
  <div class="container">
    <h1 class="fw-bold">Alex Morgan</h1>
    <p class="lead mb-0">Cloud & DevOps Engineer | AWS Enthusiast</p>
  </div>
</header>
<main>
<section class="container text-center mt-4 mb-3">
  <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=500&q=80" class="img-fluid rounded-circle profile-img" alt="Profile portrait">
  <h2 class="mt-4 fw-bold">Building reliable cloud solutions</h2>
  <p class="lead">I create scalable applications, automate deployments, and improve cloud infrastructure.</p>
  <a href="#contact" class="btn btn-primary me-2">Hire Me</a>
  <a href="#" class="btn btn-outline-dark">Download CV</a>
</section>
<section id="contact" class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7">
      <div class="card p-4 shadow-sm">
        <h3 class="text-center mb-3">Contact Me</h3>
        <form>
          <input type="text" class="form-control mb-3" placeholder="Your Name">
          <input type="email" class="form-control mb-3" placeholder="Email Address">
          <textarea class="form-control mb-3" rows="4" placeholder="Your Message"></textarea>
          <button class="btn btn-dark w-100">Send Message</button>
        </form>
      </div>
    </div>
  </div>
</section>
</main>
<footer class="bg-dark text-white text-center p-3"><p class="mb-0">© 2026 Alex Morgan</p></footer>
</body>
</html>
