<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Tracker</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body>
<header class="bg-primary text-white py-4"><div class="container d-flex justify-content-between align-items-center">
<h1 class="h2 mb-0">Task Tracker</h1><span class="badge bg-light text-primary fs-6">5 Pending</span>
</div></header>
<main class="container py-5">
<section class="card shadow-sm"><div class="card-body">
<h2 class="h4 mb-3">Today's Tasks</h2>
<div class="list-group">
<div class="list-group-item d-flex justify-content-between align-items-center"><span>Deploy application to production</span><span class="badge bg-danger">High</span></div>
<div class="list-group-item d-flex justify-content-between align-items-center"><span>Review pull requests</span><span class="badge bg-warning text-dark">Medium</span></div>
<div class="list-group-item d-flex justify-content-between align-items-center"><span>Update project documentation</span><span class="badge bg-success">Low</span></div>
<div class="list-group-item d-flex justify-content-between align-items-center"><span>Configure monitoring dashboard</span><span class="badge bg-danger">High</span></div>
<div class="list-group-item d-flex justify-content-between align-items-center"><span>Plan next sprint</span><span class="badge bg-warning text-dark">Medium</span></div>
</div>
<button class="btn btn-success mt-4">Completed <span class="badge bg-light text-success">3</span></button>
</div></section>
</main>
<footer class="text-center py-4 bg-light"><p class="mb-0">Stay organized. Ship consistently.</p></footer>
</body></html>
