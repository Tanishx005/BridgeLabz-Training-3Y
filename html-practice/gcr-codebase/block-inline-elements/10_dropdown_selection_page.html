<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Travel Selection</title>
</head>
<body>
    <!-- Q10 -->
    <h1>Travel Selection</h1>
    <label for="country">Country:</label><select id="country"><option selected>India</option><option>Japan</option><option>France</option></select><br><br>
    <label for="state">State:</label><select id="state"><option selected>Maharashtra</option><option>Gujarat</option><option>Goa</option></select><br><br>
    <label for="city">City:</label><select id="city"><option selected>Mumbai</option><option>Pune</option><option>Nashik</option></select><br><br>
    <label for="place">Favorite Tourist Place:</label><select id="place"><option selected>Gateway of India</option><option>Marine Drive</option><option>Elephanta Caves</option></select>
    <p>My selected choices are India, Maharashtra, Mumbai, and Gateway of India as my favorite tourist place.</p>
</body>
</html>
