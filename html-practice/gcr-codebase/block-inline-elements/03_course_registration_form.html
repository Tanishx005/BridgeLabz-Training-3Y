<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Course Registration Form</title>
</head>
<body>
    <!-- Q3 -->
    <h1>Course Registration</h1>
    <form><fieldset><legend>Student Details</legend>
        <label for="name">Name:</label><input type="text" id="name" name="name" required><br><br>
        <label for="email">Email:</label><input type="email" id="email" name="email" required><br><br>
        <label for="course">Select Course:</label>
        <select id="course" name="course"><option selected>HTML Fundamentals</option><option>Java Programming</option><option>Python Programming</option><option>Cloud Fundamentals</option></select><br><br>
        <input type="submit" value="Register">
    </fieldset></form>
    <h2>Available Course Schedules</h2>
    <table border="1"><tr><th>Day</th><th>Time</th><th>Instructor</th></tr><tr><td>Monday</td><td>10:00 AM - 12:00 PM</td><td>Instructor A</td></tr><tr><td>Wednesday</td><td>2:00 PM - 4:00 PM</td><td>Instructor B</td></tr><tr><td>Friday</td><td>11:00 AM - 1:00 PM</td><td>Instructor C</td></tr></table>
</body>
</html>
