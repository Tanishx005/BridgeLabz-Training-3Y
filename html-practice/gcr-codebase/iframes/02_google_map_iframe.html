<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google Map Embed</title>
</head>
<body>
    <!-- Assignment 3 - Question 2 -->
    <h1>Google Map</h1>
    <iframe
        src="https://www.google.com/maps?q=New%20Delhi%2C%20India&output=embed"
        title="Google Map showing New Delhi, India"
        width="600"
        height="450"
        loading="lazy">
    </iframe>

    <!-- loading="lazy" tells the browser to load the iframe when it is close to becoming visible. -->
</body>
</html>
