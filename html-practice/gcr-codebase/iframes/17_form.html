<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form Submission</title>
</head>
<body>
    <!-- Assignment 3 - Question 17 -->
    <h1>Simple Form</h1>
    <form action="result.html" method="get" target="result-frame">
        <label for="form-text">Enter text:</label>
        <input type="text" id="form-text" name="text" required>
        <button type="submit">Submit</button>
    </form>

    <br>
    <iframe
        src="about:blank"
        name="result-frame"
        width="80%"
        height="150"
        title="Form result">
    </iframe>
</body>
</html>
