    <h1>What is a Web Server?</h1>
    <p>A web server is software, and the computer system running it, that receives web requests and sends web resources or generated responses using HTTP or HTTPS.</p>
    <h2>Examples</h2>
    <ul><li>Apache HTTP Server</li><li>Nginx</li><li>Microsoft IIS</li><li>LiteSpeed</li><li>Apache Tomcat</li></ul>
