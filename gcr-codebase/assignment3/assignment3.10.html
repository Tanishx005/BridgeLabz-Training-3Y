<!DOCTYPE html>
<html>
<head>
    <title>Travel Selection Page</title>
</head>
<body>
    <h1>Choose Your Travel Destination</h1>

    <label for="country">Country:</label>
    <select id="country" name="country">
        <option selected>India</option>
        <option>Japan</option>
        <option>France</option>
        <option>UAE</option>
    </select>
    <br><br>

    <label for="state">State:</label>
    <select id="state" name="state">
        <option selected>Uttar Pradesh</option>
        <option>Rajasthan</option>
        <option>Maharashtra</option>
        <option>Goa</option>
    </select>
    <br><br>

    <label for="city">City:</label>
    <select id="city" name="city">
        <option selected>Agra</option>
        <option>Jaipur</option>
        <option>Mumbai</option>
        <option>Goa</option>
    </select>
    <br><br>

    <label for="place">Favorite Tourist Place:</label>
    <select id="place" name="place">
        <option selected>Taj Mahal</option>
        <option>Amber Fort</option>
        <option>Gateway of India</option>
        <option>Calangute Beach</option>
    </select>

    <p>
        My choices are: Country - India, State - Uttar Pradesh,
        City - Agra, Favorite Tourist Place - Taj Mahal.
    </p>
</body>
</html>
