<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Three-Step Form</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
<h1>Multi-Step Registration Form</h1>
<form id="registrationForm" novalidate>
  <section class="form-step">
    <h2>Step 1: Name</h2>
    <label for="fullName">Name</label>
    <input id="fullName" name="fullName" type="text" required>
    <p class="error" id="nameError"></p>
  </section>
  <section class="form-step" hidden>
    <h2>Step 2: Email</h2>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required>
    <p class="error" id="emailError"></p>
  </section>
  <section class="form-step" hidden>
    <h2>Step 3: Password</h2>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required minlength="6">
    <p class="error" id="passwordError"></p>
  </section>
  <div class="navigation">
    <button id="backButton" type="button" disabled>Back</button>
    <button id="nextButton" type="button">Next</button>
  </div>
</form>
<section id="summary" hidden>
  <h2>Registration Summary</h2>
  <p id="summaryName"></p><p id="summaryEmail"></p>
  <p>Registration completed. Password is not displayed for security.</p>
</section>
</body>
</html>
