<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>html forms</title>
</head>
<body>

    <style> 
        body {
            background-color: lightblue;
            font-family: Arial, sans-serif;
            padding: 20px;
            border-radius: 5px;
        }
        form{
            margin: 20px;
            left:auto;
            right:auto;}
        h1 {
            text-align: center;
            text-box: char(20);
            color: rgb(0, 0, 0);
            font-size: 36px;
        }
        input[type="text"], input[type="email"], input[type="date"], select {

            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        input[type="radio"],input[type="checkbot"],select{
            width: auto;
        }

        input[type="username"],input[type="Email"],input[type="gender"],input[type="date"],input[type="file submition"],select{
            
        }

     </style>



<h1>Student Registration Form</h1>
<div style="background-color: rgb(193, 255, 254); padding: 20px;
 border-radius: 5px; align-items: center; justify-content: center; display: flex; flex-direction: column;">
    
    
    <form action="/register" method="post">
        <label for="username">Name:</label>
        <label for="username" style="color: red;">*</label>
        <input type="text" id="name" name="username" required placeholder="enter your name:"><br><br>

        <label for="Email">Email:</label>
        <label for="Email" style="color: red;">*</label>
        <input type="email" id="email" name="email" required placeholder="enter your mail:"><br><br>

        <label for="gender">Gender:</label>
        <input type="radio" id="male" name="gender " value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label><br><br>

        <lable for="date" >Date of Birth:</lable>
        <label for="Date of Birth" style="color: red;">*</label>
        <input type="date" id="dob" name="dob"><br><br>
        
        <label for="file submition" >File Submition:</label>
        <input type="file" id="file" name="file"><br><br>

        <label for="dropdown">Branch:</label>
        <label for="Branch" style="color: red;">*</label>
        <select name="option" id="dropdown">
            <option value="option1">CSE</option>
            <option value="option2">Civil</option>
            <option value="option3">Electrical</option>
            <option value="option4">Mechanical</option>
            <option value="option5">Electronics</option>   
            
        </select> <br><br>

        <input type="checkbox" id="checkbox" name="checkbox" value="agree">
        <label for="checkbox" style="color: red;">*</label>
        <label for="checkbox">I agree to the terms and conditions</label><br><br>
        <input type="checkbox" id="checkbox2" name="checkbox2" value="subscribe">
        <label for="checkbox2">Subscribe to newsletter</label><br><br>
        
        <button type="reset">Reset</button>
        <input type="submit" value="Submit">
    </form>

    
  
</div>  

</body>


</html>
